services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-operativa}
      POSTGRES_USER: ${POSTGRES_USER:-operativa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}

  app:
    build: null
    image: ${APP_IMAGE:?APP_IMAGE es obligatorio en producción}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-operativa}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}@db:5432/${POSTGRES_DB:-operativa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}
      APP_SECRET: ${APP_SECRET:?APP_SECRET es obligatorio en producción}
      ENABLE_API_DOCS: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL es obligatorio en producción}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS es obligatorio en producción}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS es obligatorio en producción}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatorio en producción}
    ports:
      - "${APP_BIND_ADDRESS:?APP_BIND_ADDRESS es obligatorio en producción}:8000:8000"

  backup:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-operativa}
      POSTGRES_USER: ${POSTGRES_USER:-operativa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-900}
