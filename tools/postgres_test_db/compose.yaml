services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test_operativa
      POSTGRES_USER: test_runner
      POSTGRES_PASSWORD: test_only_password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_runner -d test_operativa"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    image: librodetrabajo-app:latest
    working_dir: /work
    environment:
      SECURITY_TEST_DATABASE_URL: postgresql://test_runner:test_only_password@test-db:5432/test_operativa
      APP_ENV: development
      APP_SECRET: test-app-secret-9f3c8e7b6d54120a9f3c8e7b6d54120
      ADMIN_PASSWORD: test-admin-9f3c8e7b6d54120
    volumes:
      - ../..:/work:ro
    command: ["python", "-m", "unittest", "tests.test_postgres_security", "-v"]
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  test_postgres_data:
